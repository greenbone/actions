name: 'Agents Production Deployment'
description: 'Promote staging agent image to enterprise feed in GHCR'

inputs:
  image_repository:
    description: 'Full image repository path (e.g., greenbone/scan-agent-app)'
    required: true
  staging_version:
    description: 'Version tag from staging to promote'
    required: true
  dry_run:
    description: 'Dry run mode - verify only, do not push to production'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for GHCR access'
    required: true

runs:
  using: "composite"
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Verify and promote staging image
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        STAGING_VERSION: ${{ inputs.staging_version }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
        if [[ ! "$IMAGE_REPOSITORY" =~ ^$component(/$component)+$ ]] || (( ${#IMAGE_REPOSITORY} > 255 )); then
          echo "::error::Invalid image repository"
          exit 1
        fi
        if [[ ! "$STAGING_VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]] || (( ${#STAGING_VERSION} > 120 )); then
          echo "::error::Invalid staging version"
          exit 1
        fi
        if [[ "$DRY_RUN" != 'true' && "$DRY_RUN" != 'false' ]]; then
          echo "::error::dry_run must be true or false"
          exit 1
        fi

        image="ghcr.io/$IMAGE_REPOSITORY"
        staging_image="$image:$STAGING_VERSION-staging"
        if ! docker manifest inspect "$staging_image" > /dev/null 2>&1; then
          echo "Error: Staging image not found: $staging_image"
          exit 1
        fi
        echo "Staging image verified: $staging_image"
        if [[ "$DRY_RUN" == 'true' ]]; then
          printf 'DRY RUN - Would push to GHCR:\n  - %s\n  - %s\n  - %s\n' "$image:$STAGING_VERSION" "$image:enterprise" "$image:latest"
        else
          docker pull "$staging_image"
          for tag in "$STAGING_VERSION" enterprise latest; do
            docker tag "$staging_image" "$image:$tag"
            docker push "$image:$tag"
          done
        fi
