name: "Admin bypass action"
author: "Jaspar Stach <jaspar.stach@greenbone.net>"
description: "An action that allows or disallows admin bypassing branch protection rules on the target branch."

inputs:
  github-token:
    description: "GitHub Token for authentication"
    default: ${{ github.token }}
  allow:
    description: "Allow or not? (Options: true, false)? Default: false"
    default: "false"
  repository:
    description: "What repository branch should be able to be bypassed by admins? Defaults to the executing repository."
    default: ${{ github.repository }}
  branch:
    description: "Target branch for the bypass. Default: main"
    default: "main"

branding:
  icon: "package"
  color: "green"

runs:
  using: "composite"
  steps:
    - name: Set up Python and pontos
      uses: greenbone/actions/setup-pontos@v3
    - name: Configure admin bypass
      run: |
        if [[ "$ALLOW" == "true" ]]; then
          allow_opt=--allow
        else
          allow_opt=--no-allow
        fi
        if [[ ! "$REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || [[ "$REPOSITORY" == -* || "$REPOSITORY" == */-* ]]; then
          echo "::error::Invalid repository"
          exit 1
        fi
        if [[ "$BRANCH" == -* ]] || ! git check-ref-format --branch "$BRANCH" >/dev/null; then
          echo "::error::Invalid branch"
          exit 1
        fi
        pontos-github-script pontos.github.scripts.enforce-admins "$REPOSITORY" "$BRANCH" "$allow_opt"
      shell: bash
      env:
        ALLOW: ${{ inputs.allow }}
        REPOSITORY: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
