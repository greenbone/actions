[project]
name = "conventional-commits-action"
version = "1.0.0"
description = "A GitHub Action to check for conventional commits"
authors = [{ name = "Björn Ricks", email = "bjoern.ricks@greenbone.net" }]
requires-python = ">=3.10,<4"
license = "GPL-3.0-or-later"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["pontos>=23.7.4"]

[project.scripts]
conventional-commits = "action.commits:main"

[dependency-groups]
dev = [
  "autohooks>=21.7.0",
  "autohooks-plugin-pylint>=21.6.0",
  "autohooks-plugin-black>=21.12.0",
  "autohooks-plugin-isort>=22.8.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["action"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 80
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | \.github
  | \.vscode
  | _build
  | build
  | dist
  | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 80
