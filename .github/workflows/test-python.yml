name: Test Python Actions

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-poetry:
    runs-on: ubuntu-latest
    name: Install poetry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        uses: ./poetry
        with:
          working-directory: ${{ github.workspace }}/.github/workflows/test-python-project
      - run: poetry --version

  test-coverage:
    runs-on: ubuntu-latest
    name: Test Coverage Python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        uses: ./coverage-python
        with:
          working-directory: ${{ github.workspace }}/.github/workflows/test-python-project
          codecov-upload: false

  test-linting:
    runs-on: ubuntu-latest
    name: Test Linting Python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        uses: ./lint-python
        with:
          working-directory: ${{ github.workspace }}/.github/workflows/test-python-project
          packages: project

  test-pipx:
    runs-on: ubuntu-latest
    name: Test Pipx Install
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pyhton
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v2.2.3
        id: python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: ./pipx
        with:
          install: mypy
          install-version: "1.0.0"
          python-path: ${{ steps.python.outputs.python-path }}
      - name: Run mypy
        run: |
          mypy --version

  test-pipx-without-venv-cache:
    runs-on: ubuntu-latest
    name: Test Pipx Without Venv Cache (${{ matrix.cache }})
    strategy:
      matrix:
        cache: ["false", "true"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest mypy
        id: pipx
        uses: ./pipx
        with:
          python-version: "3.10"
          install: mypy
          # Exercise compatibility with callers still passing the deprecated input.
          cache: ${{ matrix.cache }}
      - name: Verify application and shared pip
        env:
          PIPX_VENVS: ${{ steps.pipx.outputs.venvs }}
          CACHE_HIT: ${{ steps.pipx.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = "false"
          mypy --version
          "$PIPX_VENVS/mypy/bin/python" -m pip --version
