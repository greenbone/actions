name: Test Conventional Commits Action

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-conventional-commits:
    name: Test Conventional Commits Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: ./uv
        with:
          python-version: "3.14"
          working-directory: conventional-commits
      - name: Run tests
        working-directory: conventional-commits
        run: uv run --locked --no-dev python -m unittest discover -s tests -v
