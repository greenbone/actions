name: "Dependency Review"
description: "Scans your pull requests for dependency changes"
branding:
  icon: "umbrella"
  color: "green"
runs:
  using: "composite"
  steps:
    - name: "Checkout Repository"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Dependency Review"
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        comment-summary-in-pr: true
        vulnerability-check: true
        license-check: true
        allow-licenses: |
          0BSD,
          AGPL-3.0-or-later,
          Apache-2.0,
          BlueOak-1.0.0,
          BSD-2-Clause,
          BSD-3-Clause-Clear,
          BSD-3-Clause,
          BSL-1.0,
          bzip2-1.0.6,
          CAL-1.0,
          CC-BY-3.0,
          CC-BY-4.0,
          CC-BY-SA-4.0,
          CC0-1.0,
          EPL-2.0,
          GPL-1.0-or-later,
          GPL-2.0-only,
          GPL-2.0-or-later,
          GPL-2.0,
          GPL-3.0-only,
          GPL-3.0-or-later,
          GPL-3.0,
          ISC,
          LGPL-2.0-only,
          LGPL-2.0-or-later,
          LGPL-2.1-only,
          LGPL-2.1-or-later,
          LGPL-2.1,
          LGPL-3.0-only,
          LGPL-3.0,
          LGPL-3.0-or-later,
          LicenseRef-scancode-google-patent-license-golang,
          MIT,
          MIT-0,
          MIT-CMU,
          MPL-1.1,
          MPL-2.0,
          OFL-1.1,
          PSF-2.0,
          Python-2.0,
          Python-2.0.1,
          Unicode-3.0,
          Unicode-DFS-2016,
          Unlicense,
          Zlib,
          ZPL-2.1

# Only single licenses are allowed in this list.
# The action evaluates license combinations such as
# `License-A AND License-B` against these individual entries.
# Combination expressions in the allowlist are silently dropped. See:
# https://github.com/actions/dependency-review-action/releases/tag/v4.7.0
# https://github.com/actions/dependency-review-action/releases/tag/v4.7.1
